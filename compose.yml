name: stemora
services:
  gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      args:
        INSTALL_AUDIO_AI: ${INSTALL_AUDIO_AI:-true}
    restart: unless-stopped
    environment:
      STEMORA_DATA_DIR: /data
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${GARAGE_DEFAULT_BUCKET:-stemora}
      S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Run scripts/setup_deploy.py first}
      S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Run scripts/setup_deploy.py first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      DAILY_PROCESSING_MINUTES: ${DAILY_PROCESSING_MINUTES:-60}
      PROCESSING_QUOTA_TIMEZONE: Asia/Bangkok
      USER_STORAGE_BYTES: ${USER_STORAGE_BYTES:-200000000}
      STEMORA_WORKER_ENABLED: ${STEMORA_WORKER_ENABLED:-0}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://assistant:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:1.5b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      GEMINI_CALLS_PER_15_MIN: ${GEMINI_CALLS_PER_15_MIN:-100}
      DATABASE_DRIVER: postgresql
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: stemora
      PGUSER: stemora
      PGPASSWORD: ${STEMORA_DB_PASSWORD:?Run scripts/setup_database.py first}
    volumes:
      - workspace-data:/data
      - audio-models:/home/studio/.cache
    expose: ["8000"]
    depends_on:
      garage:
        condition: service_started
      database:
        condition: service_healthy
  database:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: stemora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STEMORA_DB_ADMIN_PASSWORD:?Run scripts/setup_database.py first}
      STEMORA_DB_PASSWORD: ${STEMORA_DB_PASSWORD:?Run scripts/setup_database.py first}
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB]
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-stemora.sh:ro
    expose: ["5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d stemora"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Run scripts/setup_deploy.py first}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Run scripts/setup_deploy.py first}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-stemora}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    expose: ["3900"]
  assistant:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    profiles: [ai]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - assistant-models:/root/.ollama
    expose: ["11434"]
volumes:
  workspace-data:
  database-data:
  garage-data:
  audio-models:
  assistant-models:
  caddy-data:
  caddy-config:
