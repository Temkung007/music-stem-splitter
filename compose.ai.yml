name: stemora-ai
services:
  assistant:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - assistant-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
volumes:
  assistant-models:
